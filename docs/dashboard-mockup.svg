<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">DRL Representation Similarity dashboard overview mockup</title>
  <desc id="desc">A dashboard wireframe with global study filters, checkpoint performance, scenario consistency, representation projection, and data quality.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .muted { fill: #667085; }
      .small { font-size: 12px; }
      .label { font-size: 13px; font-weight: 600; }
      .body { font-size: 14px; }
      .heading { font-size: 18px; font-weight: 700; }
      .title { font-size: 24px; font-weight: 750; }
      .metric { font-size: 25px; font-weight: 750; }
      .axis { stroke: #ccd2dc; stroke-width: 1; }
      .grid { stroke: #e8ebf0; stroke-width: 1; }
      .panel { fill: #ffffff; stroke: #d9dee7; stroke-width: 1; }
      .input { fill: #ffffff; stroke: #c9d0dc; stroke-width: 1; }
      .weak { stroke: #98a2b3; fill: #98a2b3; }
      .medium { stroke: #f59e0b; fill: #f59e0b; }
      .strong { stroke: #2563eb; fill: #2563eb; }
      .baseline { fill: #64748b; }
      .danger { fill: #dc2626; }
      .goal { fill: #16a34a; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#f5f7fa"/>
  <rect x="0" y="0" width="254" height="900" fill="#eef1f5"/>
  <line x1="254" y1="0" x2="254" y2="900" stroke="#d7dce5"/>

  <!-- Sidebar -->
  <text x="24" y="36" class="heading">DRL Similarity</text>
  <text x="24" y="57" class="small muted">frogger-representation-v1</text>

  <text x="24" y="96" class="label">Page</text>
  <rect x="16" y="108" width="222" height="36" rx="6" fill="#dfe8fa"/>
  <rect x="16" y="108" width="4" height="36" rx="2" fill="#2563eb"/>
  <text x="34" y="131" class="body" font-weight="650">Overview</text>
  <text x="34" y="166" class="body muted">Scenario explorer</text>
  <text x="34" y="198" class="body muted">Consistency</text>
  <text x="34" y="230" class="body muted">Separation</text>
  <text x="34" y="262" class="body muted">Cross-checkpoint geometry</text>
  <text x="34" y="294" class="body muted">Provenance &amp; exports</text>

  <line x1="24" y1="320" x2="230" y2="320" stroke="#d5dae3"/>
  <text x="24" y="351" class="label">Global filters</text>

  <text x="24" y="381" class="small muted">Algorithm</text>
  <rect x="24" y="390" width="206" height="36" rx="5" class="input"/>
  <text x="36" y="413" class="body">SB3 DQN</text>
  <text x="211" y="413" class="small muted">¼</text>

  <text x="24" y="451" class="small muted">Checkpoint</text>
  <rect x="24" y="460" width="206" height="36" rx="5" class="input"/>
  <text x="36" y="483" class="body">Strong · step 8.4M</text>
  <text x="211" y="483" class="small muted">¼</text>

  <text x="24" y="521" class="small muted">Layer</text>
  <rect x="24" y="530" width="206" height="36" rx="5" class="input"/>
  <text x="36" y="553" class="body">policy_features</text>
  <text x="211" y="553" class="small muted">¼</text>

  <text x="24" y="591" class="small muted">Scenarios</text>
  <rect x="24" y="602" width="63" height="28" rx="14" fill="#e3e7ed"/>
  <circle cx="37" cy="616" r="4" class="baseline"/>
  <text x="46" y="620" class="small">Base</text>
  <rect x="92" y="602" width="65" height="28" rx="14" fill="#fee2e2"/>
  <circle cx="105" cy="616" r="4" class="danger"/>
  <text x="114" y="620" class="small">Danger</text>
  <rect x="162" y="602" width="63" height="28" rx="14" fill="#dcfce7"/>
  <circle cx="175" cy="616" r="4" class="goal"/>
  <text x="184" y="620" class="small">Goal</text>

  <text x="24" y="663" class="small muted">Pair set</text>
  <rect x="24" y="672" width="206" height="36" rx="5" class="input"/>
  <text x="36" y="695" class="body">Aligned step</text>
  <text x="211" y="695" class="small muted">¼</text>

  <rect x="24" y="734" width="206" height="38" rx="5" fill="#ffffff" stroke="#c9d0dc"/>
  <text x="91" y="758" class="label">Reset filters</text>

  <rect x="24" y="812" width="206" height="57" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
  <circle cx="40" cy="832" r="5" fill="#f59e0b"/>
  <text x="52" y="835" class="label">Exploratory study</text>
  <text x="40" y="854" class="small muted">1 training seed · show uncertainty</text>

  <!-- Header -->
  <text x="286" y="42" class="title">Study overview</text>
  <text x="286" y="65" class="body muted">Atari Frogger · CNN policy · frozen scenario clips</text>
  <rect x="1176" y="25" width="232" height="34" rx="17" fill="#ecfdf3" stroke="#bbf7d0"/>
  <circle cx="1194" cy="42" r="5" fill="#16a34a"/>
  <text x="1208" y="47" class="small" font-weight="650">Artifacts valid · 8f26b40c</text>

  <!-- Metrics -->
  <rect x="286" y="91" width="198" height="92" rx="8" class="panel"/>
  <text x="302" y="116" class="small muted">FINAL RETURN · STRONG</text>
  <text x="302" y="151" class="metric">18.7</text>
  <text x="371" y="151" class="small" fill="#16a34a">+12.4 vs weak</text>
  <text x="302" y="171" class="small muted">95% episode CI 16.221.1</text>

  <rect x="496" y="91" width="198" height="92" rx="8" class="panel"/>
  <text x="512" y="116" class="small muted">SCENARIO CLIPS</text>
  <text x="512" y="151" class="metric">60</text>
  <text x="560" y="151" class="small muted">20 per label</text>
  <text x="512" y="171" class="small muted">42 train · 18 held out</text>

  <rect x="706" y="91" width="198" height="92" rx="8" class="panel"/>
  <text x="722" y="116" class="small muted">EXTRACTED LAYERS</text>
  <text x="722" y="151" class="metric">6</text>
  <text x="746" y="151" class="small muted">all checkpoints</text>
  <text x="722" y="171" class="small muted">No missing activations</text>

  <rect x="916" y="91" width="198" height="92" rx="8" class="panel"/>
  <text x="932" y="116" class="small muted">COSINE CONSISTENCY</text>
  <text x="932" y="151" class="metric">0.81</text>
  <text x="990" y="151" class="small" fill="#16a34a">+0.22</text>
  <text x="932" y="171" class="small muted">Strong · danger · aligned</text>

  <rect x="1126" y="91" width="282" height="92" rx="8" class="panel"/>
  <text x="1142" y="116" class="small muted">WITHIN / BETWEEN GAP</text>
  <text x="1142" y="151" class="metric">0.29</text>
  <text x="1201" y="151" class="small" fill="#16a34a">clearer separation</text>
  <text x="1142" y="171" class="small muted">Clip bootstrap · n=60</text>

  <!-- Performance chart -->
  <rect x="286" y="201" width="748" height="318" rx="8" class="panel"/>
  <text x="306" y="232" class="heading">Held-out return during training</text>
  <text x="306" y="251" class="small muted">Mean raw episode return · selection seed suite</text>
