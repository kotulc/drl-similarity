  <line x1="322" y1="274" x2="322" y2="463" class="axis"/>
  <line x1="322" y1="416" x2="1006" y2="416" class="grid"/>
  <line x1="322" y1="369" x2="1006" y2="369" class="grid"/>
  <line x1="322" y1="322" x2="1006" y2="322" class="grid"/>
  <line x1="322" y1="275" x2="1006" y2="275" class="grid"/>
  <text x="302" y="467" class="small muted">0</text>
  <text x="296" y="420" class="small muted">5</text>
  <text x="290" y="373" class="small muted">10</text>
  <text x="290" y="326" class="small muted">15</text>
  <text x="290" y="279" class="small muted">20</text>
  <text x="316" y="487" class="small muted">0</text>
  <text x="446" y="487" class="small muted">2M</text>
  <text x="580" y="487" class="small muted">4M</text>
  <text x="716" y="487" class="small muted">6M</text>
  <text x="852" y="487" class="small muted">8M</text>
  <text x="990" y="487" class="small muted">10M</text>
  <text x="628" y="507" class="small muted">Training steps</text>
  <text transform="translate(274,391) rotate(-90)" class="small muted">Raw episode return</text>

  <polyline points="322,450 390,443 458,431 526,436 594,406 662,382 730,389 798,342 866,319 934,287 1006,299"
            fill="none" stroke="#2563eb" stroke-width="3"/>
  <circle cx="390" cy="443" r="5" class="weak"/>
  <circle cx="662" cy="382" r="5" class="medium"/>
  <circle cx="934" cy="287" r="6" class="strong"/>
  <line x1="390" y1="275" x2="390" y2="463" stroke="#98a2b3" stroke-dasharray="4 4"/>
  <line x1="662" y1="275" x2="662" y2="463" stroke="#f59e0b" stroke-dasharray="4 4"/>
  <line x1="934" y1="275" x2="934" y2="463" stroke="#2563eb" stroke-dasharray="4 4"/>
  <circle cx="716" cy="229" r="4" class="weak"/><text x="726" y="233" class="small">Weak</text>
  <circle cx="779" cy="229" r="4" class="medium"/><text x="789" y="233" class="small">Medium</text>
  <circle cx="860" cy="229" r="4" class="strong"/><text x="870" y="233" class="small">Strong</text>

  <!-- Quality panel -->
  <rect x="1046" y="201" width="362" height="318" rx="8" class="panel"/>
  <text x="1066" y="232" class="heading">Data quality</text>
  <text x="1066" y="251" class="small muted">Pre-analysis checks</text>
  <circle cx="1074" cy="283" r="6" fill="#16a34a"/>
  <text x="1090" y="288" class="body">All artifact checksums match</text>
  <circle cx="1074" cy="317" r="6" fill="#16a34a"/>
  <text x="1090" y="322" class="body">Scenario clips balanced</text>
  <circle cx="1074" cy="351" r="6" fill="#16a34a"/>
  <text x="1090" y="356" class="body">No evaluation/collection seed overlap</text>
  <circle cx="1074" cy="385" r="6" fill="#16a34a"/>
  <text x="1090" y="390" class="body">Byte-identical stimuli across checkpoints</text>
  <circle cx="1074" cy="419" r="6" fill="#f59e0b"/>
  <text x="1090" y="424" class="body">Only one independent training seed</text>
  <rect x="1066" y="451" width="316" height="43" rx="5" fill="#f8fafc" stroke="#d9dee7"/>
  <text x="1082" y="477" class="label">Open provenance and regeneration details ’</text>

  <!-- Bottom charts -->
  <rect x="286" y="533" width="551" height="337" rx="8" class="panel"/>
  <text x="306" y="565" class="heading">Within-scenario cosine similarity</text>
  <text x="306" y="584" class="small muted">Aligned steps across clips · policy_features · 95% clip-bootstrap CI</text>
  <line x1="342" y1="812" x2="809" y2="812" class="axis"/>
  <line x1="342" y1="615" x2="342" y2="812" class="axis"/>
  <line x1="342" y1="763" x2="809" y2="763" class="grid"/>
  <line x1="342" y1="714" x2="809" y2="714" class="grid"/>
  <line x1="342" y1="665" x2="809" y2="665" class="grid"/>
  <line x1="342" y1="616" x2="809" y2="616" class="grid"/>
  <text x="310" y="816" class="small muted">0.0</text>
  <text x="310" y="767" class="small muted">0.2</text>
  <text x="310" y="718" class="small muted">0.4</text>
  <text x="310" y="669" class="small muted">0.6</text>
  <text x="310" y="620" class="small muted">0.8</text>
  <text x="403" y="836" class="small muted">Weak</text>
  <text x="556" y="836" class="small muted">Medium</text>
  <text x="718" y="836" class="small muted">Strong</text>
  <text transform="translate(294,750) rotate(-90)" class="small muted">Cosine similarity</text>
  <line x1="426" y1="722" x2="426" y2="756" stroke="#98a2b3" stroke-width="2"/><circle cx="426" cy="738" r="6" class="weak"/>
  <line x1="580" y1="670" x2="580" y2="704" stroke="#f59e0b" stroke-width="2"/><circle cx="580" cy="687" r="6" class="medium"/>
  <line x1="742" y1="600" x2="742" y2="638" stroke="#2563eb" stroke-width="2"/><circle cx="742" cy="619" r="6" class="strong"/>
  <circle cx="686" cy="563" r="4" class="baseline"/><text x="696" y="567" class="small">Baseline</text>
  <circle cx="755" cy="563" r="4" class="danger"/><text x="765" y="567" class="small">Danger</text>

  <rect x="849" y="533" width="559" height="337" rx="8" class="panel"/>
  <text x="869" y="565" class="heading">Scenario geometry · PCA</text>
  <text x="869" y="584" class="small muted">Clip centroids · strong checkpoint · visualization only</text>
  <line x1="892" y1="812" x2="1381" y2="812" class="axis"/>
  <line x1="892" y1="615" x2="892" y2="812" class="axis"/>
  <text x="1095" y="838" class="small muted">PC1 (42% variance)</text>
