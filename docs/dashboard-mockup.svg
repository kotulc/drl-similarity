    <circle cx="1325" cy="760" r="7" class="goal"/><circle cx="1342" cy="721" r="7" class="goal"/>
  </g>
  <circle cx="1132" cy="563" r="4" class="baseline"/><text x="1142" y="567" class="small">Baseline</text>
  <circle cx="1212" cy="563" r="4" class="danger"/><text x="1222" y="567" class="small">Danger</text>
  <circle cx="1282" cy="563" r="4" class="goal"/><text x="1292" y="567" class="small">Goal</text>
