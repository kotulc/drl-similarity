analysis:
  bootstrap:
    confidence_level: 0.95
    replicates: 20
    seed: 4001
    unit: clip
  embeddings:
  - enabled: true
    id: pca
    kwargs:
      components: 2
  metrics:
  - enabled: true
    id: cosine
    kwargs: {}
  - enabled: true
    id: correlation
    kwargs: {}
  - enabled: true
    id: normalized_euclidean
    kwargs:
      standardize_on: train_clips
  - enabled: true
    id: centroid_dispersion
    kwargs: {}
  - enabled: true
    id: temporal_cosine
    kwargs:
      lags:
      - 1
      - 2
  - enabled: true
    id: within_between_gap
    kwargs: {}
  - enabled: true
    id: silhouette
    kwargs: {}
  - enabled: true
    id: nearest_centroid_accuracy
    kwargs: {}
  - enabled: true
    id: linear_cka
    kwargs: {}
  - enabled: true
    id: rsa_spearman
    kwargs:
      first_order_distance: correlation
  - enabled: true
    id: svcca
    kwargs:
      variance_retained: 0.99
  - enabled: true
    id: orthogonal_procrustes
    kwargs: {}
  pair_sets:
  - cross_clip_all
  - cross_clip_aligned_step
  - clip_centroids
artifacts:
  collision: error
  root: tests/fixtures/study/results
dashboard:
  charts:
    clip_fps: 8
    confidence_intervals: true
    max_heatmap_samples: 500
    show_raw_points: true
  default_filters:
    checkpoint: strong
    column_scenario: danger
    frames_per_case: 3
    layer: policy_features
    pair_set: cross_clip_aligned_step
    primary_metric: cosine
    row_scenario: danger
  default_page: similarity_matrix
  downloads:
    enabled: true
    formats:
    - csv
    - png
  id: fixture-dashboard-v1
  kind: dashboard
  schema_version: 1
  theme:
    capability_order:
    - weak
    - medium
    - strong
    scenario_order:
    - baseline
    - danger
    - goal
  title: Fixture representation study (synthetic)
experiments:
- checkpoint_set: selected
  run_dir: tests/fixtures/study/fixture-dqn-run
extraction:
  batch_size: 16
  device: cpu
  dtype: float32
  layers:
  - name: conv3
    pooling: global_average
    required: true
    source: conv3
    sources_by_adapter: null
  - name: policy_features
    pooling: none
    required: true
    source: policy_features
    sources_by_adapter: null
  - name: q_values
    pooling: none
    required: true
    source: q_values
    sources_by_adapter: null
id: fixture-study-v1
kind: study
scenarios:
  burn_in_steps: 1
  clip_steps: 6
  collection:
    candidate_windows:
      baseline:
        anchor: life_start
        min_reward: 0.0
        offset_steps: 0
      danger:
        anchor: life_lost
        min_reward: 0.0
        offset_steps: -5
      goal:
        anchor: positive_goal_event
        min_reward: 0.0
        offset_steps: -5
    checkpoint: strong
    episodes_per_seed: 1
    experiment_index: 0
    max_agent_steps: 64
    retain_source_rgb: false
    seeds:
    - 3001
    - 3002
    write_video_previews: false
  labels:
  - baseline
  - danger
  - goal
  manifest: tests/fixtures/study/scenarios/fixture-clips.yaml
  minimum_clips_per_label: 4
  review:
    minimum_reviewers: 1
    require_approved: true
  split:
    seed: 3501
    train_fraction: 0.5
    unit: clip
schema_version: 1
