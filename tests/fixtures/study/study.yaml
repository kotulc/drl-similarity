# SYNTHETIC fixture configuration generated by scripts/generate_fixture_study.py. Do not edit by hand.
schema_version: 1
kind: study
id: fixture-study-v1
experiments:
- run_dir: fixture-dqn-run
  checkpoint_set: selected
scenarios:
  manifest: scenarios/fixture-clips.yaml
  labels:
  - baseline
  - danger
  - goal
  minimum_clips_per_label: 4
  clip_steps: 6
  burn_in_steps: 1
  collection:
    experiment_index: 0
    checkpoint: strong
    seeds:
    - 3001
    - 3002
    episodes_per_seed: 1
    max_agent_steps: 64
    retain_source_rgb: false
    write_video_previews: false
    candidate_windows:
      baseline:
        anchor: life_start
        offset_steps: 0
      danger:
        anchor: life_lost
        offset_steps: -5
      goal:
        anchor: positive_goal_event
        offset_steps: -5
  review:
    require_approved: true
    minimum_reviewers: 1
  split:
    unit: clip
    train_fraction: 0.5
    seed: 3501
extraction:
  batch_size: 16
  device: cpu
  dtype: float32
  layers:
  - name: conv3
    source: conv3
    pooling: global_average
  - name: policy_features
    source: policy_features
    pooling: none
  - name: q_values
    source: q_values
    pooling: none
analysis:
  pair_sets:
  - cross_clip_all
  - cross_clip_aligned_step
  - clip_centroids
  metrics:
  - id: cosine
  - id: correlation
  - id: normalized_euclidean
    kwargs:
      standardize_on: train_clips
  - id: centroid_dispersion
  - id: temporal_cosine
    kwargs:
      lags:
      - 1
      - 2
  - id: within_between_gap
  - id: silhouette
  - id: nearest_centroid_accuracy
  - id: linear_cka
  - id: rsa_spearman
    kwargs:
      first_order_distance: correlation
  - id: svcca
    kwargs:
      variance_retained: 0.99
  - id: orthogonal_procrustes
  bootstrap:
    unit: clip
    replicates: 20
    confidence_level: 0.95
    seed: 4001
  embeddings:
  - id: pca
    kwargs:
      components: 2
dashboard:
  ref: dashboard.yaml
artifacts:
  root: results
  collision: error
