schema_version: 1
kind: algorithm
id: sb3-ppo-nature-cnn-v1

adapter: sb3.ppo
policy: CnnPolicy
policy_kwargs:
  normalize_images: true
  features_extractor: nature_cnn
model_kwargs:
  learning_rate: 0.00025
  n_steps: 128
  batch_size: 256
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.1
capabilities:
  action_spaces: [discrete, box]
  recurrent: false
  activation_layers:
    - conv1
    - conv2
    - conv3
    - conv_flat
    - policy_features
    - policy_latent
    - value_latent
    - action_logits
    - value
