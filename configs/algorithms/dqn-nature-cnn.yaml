schema_version: 1
kind: algorithm
id: sb3-dqn-nature-cnn-v1

adapter: sb3.dqn
policy: CnnPolicy
policy_kwargs:
  normalize_images: true
  features_extractor: nature_cnn
model_kwargs:
  learning_rate: 0.0001
  buffer_size: 100000
  learning_starts: 80000
  batch_size: 32
  tau: 1.0
  gamma: 0.99
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 1000
  exploration_fraction: 0.1
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.01
capabilities:
  action_spaces: [discrete]
  recurrent: false
  activation_layers:
    - conv1
    - conv2
    - conv3
    - conv_flat
    - policy_features
    - q_values
